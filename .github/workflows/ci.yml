name: CI
on:
  push:
    branches: [main, web-v2]
  pull_request:

jobs:
  database:
    name: Database (migrasi + uji aturan bisnis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Jalankan migrasi, seed, dan semua uji
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash supabase/tests/jalankan.sh

  web:
    name: Web (typecheck, lint, build)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://contoh.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-contoh
      NEXT_PUBLIC_SITE_URL: https://rentalaja.co.id
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

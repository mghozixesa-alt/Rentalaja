# Server GPS Rentalaja (Traccar). Jalankan di VPS: docker compose up -d
services:
  traccar:
    image: traccar/traccar:latest
    container_name: traccar
    restart: unless-stopped
    ports:
      - "8082:8082"        # web Traccar (admin) — tutup dari internet bila tidak perlu, akses lewat SSH tunnel
      - "5023:5023"        # GT06 (MiCODUS MV720/MV730/MV33 dll.)
      - "5015:5015"        # JT808/huabao (sebagian MiCODUS seri baru)
      - "5013:5013"        # H02 (sebagian alat murah lain)
    volumes:
      - ./traccar.xml:/opt/traccar/conf/traccar.xml:ro
      - ./data:/opt/traccar/data
      - ./logs:/opt/traccar/logs
    env_file: .env
